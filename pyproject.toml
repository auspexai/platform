[project]
name = "auspexai-platform"
dynamic = ["version"]
description = "Coordinator daemon and platform infrastructure for the AuspexAI volunteer compute network"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "AuspexAI Maintainers", email = "contact@auspexai.network" },
]
keywords = ["auspexai", "distributed-compute", "ai-safety", "research", "coordinator"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.5",
    "click>=8.1",
    "cryptography>=42",
    "cbor2>=5.6",
    "httpx>=0.27",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.24",
    # Property-based integrity pass over the result-acceptance + export state
    # machine (§9 #47 follow-up; 3 integrity bugs in 48h argued for systematic
    # adversarial coverage over incidental discovery).
    "hypothesis>=6.100",
    # Hard per-test wall-clock cap so a wedged test fails fast instead of
    # hanging the run. An unconsumed infinite SSE body parks the server
    # generator in its keepalive `wait_for` under Starlette's TestClient (no
    # broken-pipe/http.disconnect over the in-memory transport) — see
    # sse_event_bus_design.md. The timeout converts that wedge into a failure.
    "pytest-timeout>=2.3",
    "ruff==0.15.15",  # pinned exactly: unbounded ruff drifts CI red as new rules ship
    # Test env pinned to current fastapi/starlette. starlette 1.x's TestClient
    # emits a DeprecationWarning that filterwarnings=error would escalate to a
    # collection error — handled by a targeted ignore in [tool.pytest.ini_options]
    # below rather than holding the dependency back.
    "fastapi==0.136.3",
    "starlette<1.3",
]

[project.scripts]
auspexai-coordinator = "auspexai_platform.cli:main"

[project.urls]
Homepage = "https://auspexai.network"
Repository = "https://github.com/auspexai/platform"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version is derived from git tags (hatch-vcs), stamped at build time — there is
# no hand-maintained version string. See version_provenance.md (V-M1).
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/auspexai_platform"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    # Writes ONE throwaway entry to the PUBLIC rekor.sigstore.dev log and
    # round-trips it. Opt-in (skipped unless AUSPEXAI_LIVE_REKOR=1) — run as a
    # RELEASE-CHECKLIST step before tagging:
    #     AUSPEXAI_LIVE_REKOR=1 uv run pytest -m live_rekor
    # Rationale: the mock-vs-live bug class (rekord-kind discovery 2026-06-09,
    # executor-harness seam 2026-06-08) — mocks encode our beliefs about the
    # other side; one real entry per release checks the beliefs.
    "live_rekor: writes a throwaway entry to public Rekor (opt-in, release checklist)",
]
# Per-test wall-clock cap (pytest-timeout). Generous for the slowest real test
# (~a couple seconds) but well under a hang. `thread` method works without
# signal support and interrupts blocked C/await calls.
timeout = 60
timeout_method = "thread"
filterwarnings = [
    "error",
    # starlette 1.x's TestClient deprecates the `httpx` transport in favour of
    # `httpx2`; the warning fires at import of starlette.testclient and would
    # otherwise fail collection under `error`. Ignore this one third-party
    # deprecation (the app's own httpx usage is unaffected).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
