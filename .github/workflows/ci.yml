name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for CI: it only ever reads the tree. The release
# workflows declare their own broader scopes at the job that needs them.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install package + dev dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          source .venv/bin/activate
          ruff check src tests
          ruff format --check src tests

      - name: Run pytest
        run: |
          source .venv/bin/activate
          pytest -v
